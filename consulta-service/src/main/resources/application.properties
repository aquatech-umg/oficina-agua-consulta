spring.application.name=consulta-service
server.port=8082

# Lee el .env local (no se sube a Git): primero el de este módulo y luego el de la raíz del repo.
# optional: si no existe, arranca igual. Las variables de la consola siguen teniendo prioridad.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:oficina_agua}
spring.datasource.username=${DB_USER:lectura}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
# Limite de peticiones por IP (AQ-108)
consulta.limite.max-peticiones=30
consulta.limite.ventana-segundos=60

# hCaptcha (AQ-117): el secret NUNCA va en el repo; se lee de HCAPTCHA_SECRET (variable de entorno o .env local)
hcaptcha.secret=${HCAPTCHA_SECRET:}
hcaptcha.verify-url=https://api.hcaptcha.com/siteverify
hcaptcha.timeout-segundos=5