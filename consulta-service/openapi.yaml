openapi: 3.0.3
info:
  title: Servicio de Consulta Pública - Oficina del Agua
  description: |
    Servicio de solo lectura para que cualquier persona consulte el estado
    de cuenta de un contador de agua, sin login ni registro.
    Lee de la réplica de MySQL (no de la instancia del monolito).
    Este servicio verifica el token de hCaptcha (AQ-117) y limita las peticiones
    por IP (AQ-108). El BFF muestra el widget y reenvía el token.
  version: 0.1.0
servers:
  - url: http://localhost:8082
    description: Desarrollo local
tags:
  - name: Consulta pública
    description: Consulta de estado de cuenta por código de contador

paths:
  /api/v1/contadores/{codigo}/estado-cuenta:
    get:
      tags: [Consulta pública]
      summary: Estado de cuenta de un contador
      description: |
        Devuelve el saldo pendiente y los recibos pendientes del contador
        identificado por su número de registro (por ejemplo CONT-001).
        Cada recibo incluye la mora y el total a pagar, calculados con la misma
        regla que la pantalla de Pagos del monolito: el recibo vence el día 10
        (del mismo mes si se emitió del 1 al 10, del mes siguiente si se emitió
        después) y, pasado ese día, se cobra una sola vez la mora de su tarifa
        (monto fijo + porcentaje del monto). El saldo pendiente suma los totales.
        La fecha de referencia es la de hoy en la zona America/Guatemala.
      operationId: obtenerEstadoCuenta
      parameters:
        - name: codigo
          in: path
          required: true
          description: Número de registro del contador
          schema:
            type: string
            maxLength: 50
            example: CONT-001
        - name: X-Captcha-Token
          in: header
          required: true
          description: |
            Token de hCaptcha que resolvió el visitante. Es de un solo uso:
            hay que resolver un captcha nuevo en cada consulta.
          schema:
            type: string
      responses:
        '200':
          description: Estado de cuenta encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoCuenta'
        '400':
          description: Código de contador con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Falta el token de captcha o hCaptcha lo rechazó (se evalúa después del límite por IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No existe un contador con ese código
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Demasiadas peticiones desde la misma IP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo verificar el captcha porque hCaptcha no responde; no se deja pasar a nadie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    EstadoCuenta:
      type: object
      required: [codigoContador, saldoPendiente, recibosPendientes]
      properties:
        codigoContador:
          type: string
          description: Número de registro del contadoru
          example: CONT-001
        direccionServicio:
          type: string
          example: 11 avenida 7-80, Jutiapa
        sector:
          type: string
          nullable: true
          example: Sector Norte
          saldoPendiente:
          type: number
          format: double
          description: Suma de los totales (monto + mora) de los recibos pendientes, en quetzales (Q)
          example: 198.00
        recibosPendientes:
          type: array
          items:
            $ref: '#/components/schemas/ReciboPendiente'
    ReciboPendiente:
      # Campos alineados con las columnas reales de la tabla recibos (AQ-87);
      # mora y total se calculan al consultar, como en el monolito (AQ-134)
      type: object
      required: [numeroRecibo, periodo, fechaEmision, monto, mora, total]
      properties:
        numeroRecibo:
          type: string
          description: Número del recibo
          example: REC-039001
        periodo:
          type: string
          description: Mes y año que cubre el recibo (AAAA-MM)
          example: 2026-09
        fechaEmision:
          type: string
          format: date
          description: Fecha de emisión del recibo (AAAA-MM-DD)
          example: 2026-09-25
        monto:
          type: number
          format: double
          description: Monto del recibo en quetzales (Q), sin mora
          example: 180.00
        mora:
          type: number
          format: double
          description: Mora del recibo en quetzales (Q). Es 0.00 si el recibo no está vencido o su tarifa no define mora.
          example: 18.00
        total:
          type: number
          format: double
          description: Total a pagar en quetzales (Q), monto más mora
          example: 198.00
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
          example: CONTADOR_NO_ENCONTRADO
        mensaje:
          type: string
          example: No existe un contador con el código indicado
